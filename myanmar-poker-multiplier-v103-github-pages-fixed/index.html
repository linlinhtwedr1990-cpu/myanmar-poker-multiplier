<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myanmar Poker Multiplier V10.3</title>
<link rel="stylesheet" href="src/game-v100.css">
<style>
body{margin:0}.mp2{max-width:1180px;margin:20px auto;padding:0 12px}.lobby.card,.game-shell{max-width:1100px;margin:auto}.room-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.room-code{font-size:28px;letter-spacing:3px}.status{padding:10px;border-radius:10px;margin:12px 0}.status.ready{background:#e7f7ed}.status.connecting{background:#fff4d6}.status.error{background:#ffe5e5}.lobby-players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.lobby-player{padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff}.connected{display:block;color:#198754;font-size:12px}.host{font-size:11px;background:#222;color:#fff;padding:2px 6px;border-radius:5px;margin-left:6px}.turn{outline:3px solid #e6b800}.private-note{font-size:12px;color:#666}.netbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.offerbox{padding:10px;border:1px dashed #aaa;border-radius:10px}.disabled{opacity:.5}.danger{background:#ffe8e8;padding:12px;border-radius:10px}.public-card{font-size:22px;font-weight:700}.seat .avatar{font-size:28px}.my-seat{box-shadow:0 0 0 2px #222 inset}.toast{position:fixed;right:18px;bottom:18px;padding:12px 16px;background:#222;color:#fff;border-radius:10px;z-index:20}.sync-dot{font-size:12px}
</style></head>
<body><div id="app" class="mp2"></div>

<script>
window.addEventListener('error', function(e) {
  var app = document.getElementById('app');
  if (app && (!app.innerHTML || app.innerHTML.trim()==='')) {
    app.innerHTML =
      '<div style="max-width:900px;margin:40px auto;padding:24px;font-family:system-ui;border:1px solid #ddd;border-radius:16px;background:#fff">' +
      '<h1>🃏 Myanmar Poker Multiplier</h1>' +
      '<p><b>The game could not start.</b></p>' +
      '<pre style="white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:10px">' +
      String(e.message || e.error || e) + '</pre>' +
      '<p>Please refresh this page. If the problem continues, send this screen to the developer.</p>' +
      '</div>';
  }
});
</script>

<script src="src/game-v100.js"></script>
<script src="src/multiplayer-v102.js"></script>
<noscript><div style="margin:40px;padding:20px;font-family:system-ui;background:#fff;border:2px solid #c00;border-radius:12px">Please enable JavaScript to play Myanmar Poker Multiplier.</div></noscript></body></html>
